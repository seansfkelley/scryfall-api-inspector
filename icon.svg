<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Brown circle background -->
  <circle cx="64" cy="64" r="62" fill="#7B5030"/>

  <!--
    Five MTG color dots in card-back pentagon order, clockwise from top:
    White (top), Blue (upper-right), Black (lower-right), Red (lower-left), Green (upper-left)
    Pentagon center (64,64), vertex radius 38px.
  -->
  <circle cx="64"  cy="26"  r="8" fill="#F5F0D8" stroke="#fff" stroke-width="1.5"/> <!-- White  -->
  <circle cx="100" cy="52"  r="8" fill="#1565C0" stroke="#fff" stroke-width="1.5"/> <!-- Blue   -->
  <circle cx="86"  cy="95"  r="8" fill="#1A1A1A" stroke="#fff" stroke-width="1.5"/> <!-- Black  -->
  <circle cx="42"  cy="95"  r="8" fill="#C62828" stroke="#fff" stroke-width="1.5"/> <!-- Red    -->
  <circle cx="28"  cy="52"  r="8" fill="#2E7D32" stroke="#fff" stroke-width="1.5"/> <!-- Green  -->

  <!-- JSON indicator -->
  <text x="64" y="73" font-family="monospace" font-size="22" font-weight="bold"
        fill="#F5F0D8" text-anchor="middle">{}</text>
</svg>
